apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "voxnova.name" . }}-data
  labels: {{- include "voxnova.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # uninstalling the release keeps the customer memory
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
