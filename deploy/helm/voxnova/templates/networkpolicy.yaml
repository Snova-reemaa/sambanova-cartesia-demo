{{- if .Values.networkPolicy.enabled }}
# Only the app's port is open. Outbound is not restricted: the app calls SambaNova, Cartesia and
# the search provider.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voxnova.name" . }}
  labels: {{- include "voxnova.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "voxnova.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 8080, protocol: TCP}
      {{- with .Values.networkPolicy.from }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
