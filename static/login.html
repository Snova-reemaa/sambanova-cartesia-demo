<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxNova</title>
<meta name="theme-color" content="#22105C">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { overflow: auto; }
  .gate {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center;
    gap: 28px;
    padding: 48px clamp(20px, 8vw, 120px);
    max-width: 1100px;
  }
  .gate .wordmark { font-size: 17px; }
  .gate h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 300;
    font-size: clamp(40px, 7vw, 96px);
    line-height: .98;
    letter-spacing: -0.055em;
    max-width: none;
  }
  .gate p { margin: 0; font-size: 16px; color: var(--muted); max-width: 46ch; }
  .gate form {
    display: flex; gap: 6px; align-items: center;
    width: min(520px, 100%);
    padding: 7px;
    background: var(--deep);
    border-radius: 999px;
  }
  .gate input {
    flex: 1; min-width: 0; height: 48px; padding: 0 18px;
    font-family: var(--sans); font-size: 16px;
    color: var(--paper); background: transparent; border: none;
  }
  .gate input::placeholder { color: var(--faint); }
  .gate input:focus { outline: none; }
  .gate form:focus-within { box-shadow: 0 0 0 2px var(--paper); }
  .gate button {
    height: 48px; padding: 0 26px;
    font-family: var(--sans); font-size: 15px; font-weight: 700;
    color: var(--ground); background: var(--paper);
    border: none; border-radius: 999px; cursor: pointer;
  }
  .gate button:hover { background: #fff; }
  .bad { font-size: 14px; font-weight: 600; color: var(--bad) !important; }
  .fine { font-size: 13px !important; color: var(--faint) !important; }
  .agree {
    display: flex; gap: 10px; align-items: flex-start;
    width: min(520px, 100%);
    margin: 14px 0 2px; padding: 0 8px; text-align: left;
    font-size: 13px; line-height: 1.5; color: var(--muted);
    cursor: pointer;
  }
  .agree input { width: 16px; height: 16px; margin: 2px 0 0; flex: none; cursor: pointer; }
  .agree a { color: var(--tts); }
  button:disabled { opacity: .45; cursor: not-allowed; }
</style>
</head>
<body>

<div class="gate">
  <h1>VoxNova</h1>
  <!-- passphrase: cut by the server when Auth0 signs people in -->
  <p>SambaNova and Cartesia voice agent demo. Enter the passphrase you were given.</p>
  <!-- /passphrase -->

  <form method="post" action="/login" id="gatehere">
    <!-- passphrase -->
    <input type="password" name="passphrase" placeholder="Passphrase" aria-label="Passphrase"
           autocomplete="current-password" autofocus required>
    <!-- /passphrase -->
    <button type="submit" id="enter" disabled>Enter</button>
  </form>

  <label class="agree" for="consent">
    <input type="checkbox" name="consent" value="yes" id="consent" form="gatehere" required>
    <span>I agree to the <a href="/terms" target="_blank" rel="noopener">Terms of Use</a>
      and the <a href="/privacy" target="_blank" rel="noopener">Privacy Notice</a></span>
  </label>

  <p class="bad" id="bad" hidden>Wrong passphrase.</p>
  <p class="bad" id="noconsent" hidden>Please agree to the Terms and Privacy Notice.</p>
  <p class="bad" id="changed" hidden>The terms have changed since you last agreed.
    Please read them and agree again.</p>
  <p class="fine">Use Chrome or Edge for the microphone.</p>
</div>

<script src="/static/field.js"></script>
<script>
  const why = new URLSearchParams(location.search);
  if (why.has('bad')) document.getElementById('bad').hidden = false;
  if (why.has('noconsent')) document.getElementById('noconsent').hidden = false;
  if (why.has('changed')) document.getElementById('changed').hidden = false;

  // The button follows the box. The server checks as well — this only
  // saves someone the round trip.
  const consent = document.getElementById('consent');
  const enter = document.getElementById('enter');
  const sync = () => { enter.disabled = !consent.checked; };
  consent.addEventListener('change', sync);
  sync();
</script>
</body>
</html>
