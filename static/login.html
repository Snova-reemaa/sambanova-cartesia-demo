<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Loop — access</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }

  .gate {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .gate h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .gate p { margin: 0; font-size: 13.5px; color: var(--muted); }

  .gate form { display: flex; flex-direction: column; gap: 10px; }

  .gate input {
    padding: 11px 14px;
    font-family: var(--mono);
    font-size: 15px;
    color: var(--ink);
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .gate input:focus { outline: 2px solid var(--tts); outline-offset: -1px; }

  .gate button {
    padding: 11px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    color: var(--surface);
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 4px;
    cursor: pointer;
  }
  .gate button:hover { opacity: .85; }

  .bad {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--bad);
    margin: 0;
  }
</style>
</head>
<body>

<div class="gate">
  <h1>Voice Loop</h1>
  <p>A SambaNova → Cartesia speech demo. Enter the passphrase you were given.</p>

  <form method="post" action="/login">
    <input type="password" name="passphrase" placeholder="passphrase"
           autocomplete="current-password" autofocus required>
    <button type="submit">Enter</button>
  </form>

  <p class="bad" id="bad" hidden>That passphrase didn't match.</p>
</div>

<script>
  if (new URLSearchParams(location.search).has('bad')) {
    document.getElementById('bad').hidden = false;
  }
</script>
</body>
</html>
